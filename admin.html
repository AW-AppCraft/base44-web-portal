<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Base44 Apps</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        input[type="text"], input[type="url"], input[type="number"], textarea { width: 100%; padding: 10px; margin-top: 5px; }
        button { padding: 10px 15px; margin-top: 10px; }
    </style>
</head>
<body>

<h1>Admin Panel - Add New Base44 Apps</h1>

<form id="addAppForm">
    <label for="appName">App Name:</label>
    <input type="text" id="appName" required>

    <label for="appUrl">App URL:</label>
    <input type="url" id="appUrl" required>

    <label for="appDescription">Description:</label>
    <textarea id="appDescription" required></textarea>

    <label for="termsAndConditions">Terms and Conditions:</label>
    <textarea id="termsAndConditions" required></textarea>

    <label for="appPricing">Pricing:</label>
    <input type="number" id="appPricing" required>

    <button type="submit">Add App</button>
</form>

<h2>Existing Apps</h2>
<table id="appsTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>URL</th>
            <th>Description</th>
            <th>Terms</th>
            <th>Pricing</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- Existing apps will be listed here -->
    </tbody>
</table>

<script>
    // JavaScript to handle form submission and app list management (to be implemented)
</script>

</body>
</html>
