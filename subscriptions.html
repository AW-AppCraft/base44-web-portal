<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Subscription Management</h1>
    </header>
    
    <section id="available-apps">
        <h2>Available Apps</h2>
        <div class="app" id="app1">
            <h3>App Name 1</h3>
            <p>Description of app 1.</p>
            <p>Price: $10/month</p>
            <button>Subscribe</button>
            <button>Unsubscribe</button>
        </div>
        <div class="app" id="app2">
            <h3>App Name 2</h3>
            <p>Description of app 2.</p>
            <p>Price: $15/month</p>
            <button>Subscribe</button>
            <button>Unsubscribe</button>
        </div>
        <!-- More apps can be added here -->
    </section>
    
    <section id="current-subscriptions">
        <h2>Your Current Subscriptions</h2>
        <ul>
            <li>App Name 1 - Active</li>
            <li>App Name 2 - Active</li>
            <!-- Subscriptions will be dynamically populated -->
        </ul>
    </section>
    
    <footer>
        <p>&copy; 2026 AW-AppCraft. All rights reserved.</p>
    </footer>
</body>
</html>
